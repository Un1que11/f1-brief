# F1 Brief settings. No secrets here: the Telegram token and chat id live in .env.
# Read by `f1brief.config`; every command takes `--config PATH` (default: ./config.toml).
# These are the defaults of every account: what an account changes from the bot (its
# favourites, for one) is kept in the state file, see `f1brief config`.

[digest]
# Language of the digest, the off-season summary and the message after qualifying:
# "ru", "en" or "pl". The bot's buttons and replies stay Russian for now.
language = "ru"
# The send window opens at local midnight this many days before the local date of FP1.
days_before_fp1 = 2
# IANA time zone for session times, send windows and quiet hours, e.g. "America/New_York".
timezone = "Europe/Warsaw"

# Story alerts: at most max_per_day a day, none from quiet_start to quiet_end (local time,
# 24-hour HH:MM; equal times turn the quiet hours off).
[alerts]
max_per_day = 3
quiet_start = "23:00"
quiet_end = "08:00"

# Favourites are lists: add or remove entries freely. Every collector (form, teammate
# comparison, pace, track history, news, story detection) iterates over them.
#   id      - Jolpica id (constructorId / driverId)
#   name    - how the team or driver is named in the digest
#   aliases - words that mark a news item as being about them (default: the name)
#   track_future - also follow news about their future in F1 (contract, moves)
#   names   - optional name form per language, always used in texts in that language,
#             e.g. names = { ru = "Джордж Расселл", pl = "George Russell" }

[[favourites.teams]]
id = "mclaren"
name = "McLaren"

[[favourites.teams]]
id = "haas"
name = "Haas"

[[favourites.drivers]]
id = "russell"
name = "George Russell"
aliases = ["Russell"]

[[favourites.drivers]]
id = "ocon"
name = "Esteban Ocon"
aliases = ["Ocon"]
track_future = true

[[favourites.drivers]]
id = "bearman"
name = "Oliver Bearman"
aliases = ["Bearman"]
