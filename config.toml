# F1 Brief settings. No secrets here: the Telegram token and chat id live in .env.
# Read by `f1brief.config`; every command takes `--config PATH` (default: ./config.toml).

[digest]
# Language of the texts sent to Telegram (ISO 639-1). Only "ru" has prompts today.
language = "ru"
# The send window opens at local midnight this many days before the local date of FP1.
days_before_fp1 = 2
# IANA time zone for session times, send windows and quiet hours. Only Europe/Warsaw is
# accepted for now: the code still uses Warsaw time directly.
timezone = "Europe/Warsaw"

# Favourites are lists: add or remove entries freely. The collectors still use their own
# built-in favourites until F20 switches them to these lists.
#   id      - Jolpica id (constructorId / driverId)
#   name    - how the team or driver is named in the digest
#   aliases - words that mark a news item as being about them (default: the name)
#   track_future - also follow news about their future in F1 (contract, moves)

[[favourites.teams]]
id = "mclaren"
name = "McLaren"

[[favourites.teams]]
id = "haas"
name = "Haas"

[[favourites.drivers]]
id = "russell"
name = "George Russell"
aliases = ["Russell"]

[[favourites.drivers]]
id = "ocon"
name = "Esteban Ocon"
aliases = ["Ocon"]
track_future = true

[[favourites.drivers]]
id = "bearman"
name = "Oliver Bearman"
aliases = ["Bearman"]
