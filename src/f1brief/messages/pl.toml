# Polish texts of the bot, the story alerts, the offer to unfollow a quiet story and the
# archive page (F30). Same keys and {fields} as ru.toml (checked by tests/test_messages.py).

# --- formats -------------------------------------------------------------------------------
[format]
date = "{day:02d}.{month:02d}.{year}"
date_time = "{day:02d}.{month:02d}.{year} {hour:02d}:{minute:02d}"
day_time = "{weekday} {day:02d}.{month:02d} {hour:02d}:{minute:02d}"
day = "{weekday} {day:02d}.{month:02d}"
decimal_separator = ","
group_separator = " "  # no-break space
weekdays = ["pon.", "wt.", "śr.", "czw.", "pt.", "sob.", "niedz."]
months = ["sty", "lut", "mar", "kwi", "maj", "cze", "lip", "sie", "wrz", "paź", "lis", "gru"]

# Plural forms by CLDR category (pl: one, few, many); {n} is the number.
[plural.days]
one = "{n} dzień"
few = "{n} dni"
many = "{n} dni"

[status]
rumor = "plotka"
developing = "w toku"
confirmed = "potwierdzone"
denied = "zdementowane"
resolved = "zakończony"

[sessions]
fp1 = "Trening 1"
fp2 = "Trening 2"
fp3 = "Trening 3"
sprint_qualifying = "Kwalifikacje do sprintu"
sprint = "Sprint"
qualifying = "Kwalifikacje"
race = "Wyścig"

[entity_kinds]
driver = "kierowca"
team = "zespół"
person = "osoba"

[commands]
start = "Co potrafi bot i menu"
stories = "Wątki: twoje i ostatnie"
archive = "Wszystkie wątki, także zakończone"
next = "Następny wyścig i jego przegląd"
favourites = "Ulubione zespoły i kierowcy"
help = "Wszystkie polecenia"

# --- the bot: menu, /start, /help -----------------------------------------------------------
[text]
menu_stories = "📰 Wątki"
menu_archive = "🗂 Archiwum"
menu_next = "🏁 Następny wyścig"
menu_favourites = "⭐ Ulubione"
menu_help = "❓ Pomoc"
menu_back = "← Menu"
menu_prompt = "Rozumiem przyciski i polecenia. Co pokazać?"

start_same_day = "w dniu pierwszego treningu"
start_days_before = "na {days} przed pierwszym treningiem"
greeting = """
Cześć! Wysyłam przegląd F1 {when}: co się zmieniło od ostatniego wyścigu, jak radzą sobie twoje zespoły i kierowcy i czego się spodziewać w ten weekend.
Po kwalifikacjach — krótka wiadomość o tym, jak poszły ulubionym.
Nowości w wątkach, które obserwujesz (kontrakty, transfery, plotki), przychodzą od razu, a w nocy (23:00–08:00) — rano.
{next_digest}"""

help = """
Polecenia:
/start — co potrafi bot i menu
/stories — wątki, które obserwujesz, i ostatnie
/story <numer> — historia wątku ze źródłami
/follow <numer> — obserwuj wątek
/unfollow <numer> — przestań obserwować (wątek zostaje w archiwum)
/mute <numer> <dni> — bez powiadomień przez N dni
/archive — wszystkie wątki, także zakończone
/next — następny wyścig i kiedy przyjdzie przegląd
/favourites — ulubione zespoły i kierowcy

Wszystko to jest też na przyciskach: /start."""

unknown_command = "Nie znam polecenia /{name}."

