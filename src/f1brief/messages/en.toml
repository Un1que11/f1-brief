# English texts of the bot, the story alerts, the offer to unfollow a quiet story and the
# archive page (F30). Same keys and {fields} as ru.toml (checked by tests/test_messages.py).

# --- formats -------------------------------------------------------------------------------
[format]
date = "{day} {month_name} {year}"
date_time = "{day} {month_name} {year} {hour:02d}:{minute:02d}"
day_time = "{weekday} {day} {month_name} {hour:02d}:{minute:02d}"
day = "{weekday} {day} {month_name}"
decimal_separator = "."
group_separator = ","
weekdays = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"]

# Plural forms by CLDR category (en: one, other); {n} is the number.
[plural.days]
one = "{n} day"
other = "{n} days"

[status]
rumor = "rumour"
developing = "developing"
confirmed = "confirmed"
denied = "denied"
resolved = "resolved"

[sessions]
fp1 = "Practice 1"
fp2 = "Practice 2"
fp3 = "Practice 3"
sprint_qualifying = "Sprint qualifying"
sprint = "Sprint"
qualifying = "Qualifying"
race = "Race"

[entity_kinds]
driver = "driver"
team = "team"
person = "person"

[commands]
start = "What the bot does, and the menu"
stories = "Stories: yours and recent ones"
archive = "All stories, including finished ones"
next = "The next race and its digest"
favourites = "Favourite teams and drivers"
help = "All commands"

# --- the bot: menu, /start, /help -----------------------------------------------------------
[text]
menu_stories = "📰 Stories"
menu_archive = "🗂 Archive"
menu_next = "🏁 Next race"
menu_favourites = "⭐ Favourites"
menu_help = "❓ Help"
menu_back = "← Menu"
menu_prompt = "I understand buttons and commands. What shall I show?"

start_same_day = "on the day of the first practice"
start_days_before = "{days} before the first practice"
greeting = """
Hi! I send an F1 digest {when}: what has changed since the last race, how your teams and drivers are doing and what to expect this weekend.
After qualifying, a short message on how it went for your favourites.
News on the stories you follow (contracts, moves, rumours) comes right away, and at night (23:00–08:00) in the morning.
{next_digest}"""

help = """
Commands:
/start — what the bot does, and the menu
/stories — the stories you follow, and recent ones
/story <number> — a story's timeline with sources
/follow <number> — follow a story
/unfollow <number> — unfollow (the story stays in the archive)
/mute <number> <days> — no notifications for N days
/archive — all stories, including finished ones
/next — the next race and when the digest comes
/favourites — favourite teams and drivers

All of this is on the buttons too: /start."""

unknown_command = "I don't know the command /{name}."

