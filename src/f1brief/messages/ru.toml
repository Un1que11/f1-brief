# Russian texts of the bot, the story alerts, the offer to unfollow a quiet story and the
# archive page (F30). Every language file has exactly the same keys and, in each template,
# the same {fields}: tests/test_messages.py checks both. Templates are `str.format` strings.

# --- formats -------------------------------------------------------------------------------
[format]
# Fields: day, month, year, hour, minute (numbers), weekday, month_name (from the lists below).
date = "{day:02d}.{month:02d}.{year}"
date_time = "{day:02d}.{month:02d}.{year} {hour:02d}:{minute:02d}"
day_time = "{weekday} {day:02d}.{month:02d} {hour:02d}:{minute:02d}"
day = "{weekday} {day:02d}.{month:02d}"
decimal_separator = ","
group_separator = "\u00A0"  # no-break space
weekdays = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"]
months = ["янв", "фев", "мар", "апр", "мая", "июн", "июл", "авг", "сен", "окт", "ноя", "дек"]

# Plural forms by CLDR category (ru: one, few, many); {n} is the number.
[plural.days]
one = "{n} день"
few = "{n} дня"
many = "{n} дней"

[status]
rumor = "слух"
developing = "развивается"
confirmed = "подтверждено"
denied = "опровергнуто"
resolved = "завершён"

[sessions]
fp1 = "Практика 1"
fp2 = "Практика 2"
fp3 = "Практика 3"
sprint_qualifying = "Спринт-квалификация"
sprint = "Спринт"
qualifying = "Квалификация"
race = "Гонка"

[entity_kinds]
driver = "пилот"
team = "команда"
person = "персона"

# The commands under the "/" button in Telegram (setMyCommands), in this order.
[commands]
start = "Что умеет бот и меню"
stories = "Сюжеты: твои и недавние"
archive = "Все сюжеты, включая завершённые"
next = "Следующая гонка и дайджест к ней"
favourites = "Избранные команды и гонщики"
help = "Все команды"

# --- the bot: menu, /start, /help -----------------------------------------------------------
[text]
menu_stories = "📰 Сюжеты"
menu_archive = "🗂 Архив"
menu_next = "🏁 Следующая гонка"
menu_favourites = "⭐ Избранное"
menu_help = "❓ Помощь"
menu_back = "← Меню"
menu_prompt = "Я понимаю кнопки и команды. Что показать?"

start_same_day = "в день первой практики"
start_days_before = "за {days} до первой практики"
greeting = """
Привет! Я присылаю F1-дайджест {when}: что изменилось с прошлой гонки, как дела у твоих команд и гонщиков и чего ждать на уикенде.
После квалификации — короткое сообщение о том, как она прошла у избранных.
Новости по сюжетам, за которыми ты следишь (контракты, переходы, слухи), приходят сразу, а ночью (23:00–08:00) — утром.
{next_digest}"""

help = """
Команды:
/start — что умеет бот и меню
/stories — сюжеты, за которыми ты следишь, и недавние
/story <номер> — хронология сюжета с источниками
/follow <номер> — следить за сюжетом
/unfollow <номер> — отписаться (сюжет останется в архиве)
/mute <номер> <дни> — без уведомлений на N дней
/archive — все сюжеты, включая завершённые
/next — следующая гонка и когда придёт дайджест
/favourites — избранные команды и гонщики

Всё это есть и на кнопках: /start."""

unknown_command = "Не знаю команду /{name}."

